<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Office 3D · Voltaire AI Content Studio</title>
<style>
  :root{
    --gold:#f5c451; --gold2:#ffe08a; --ink:#e9ecf5; --mut:#8b93a8;
    --panel:rgba(9,13,24,.74); --line:rgba(245,196,81,.20);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04060b;color:var(--ink);overflow:hidden;
    font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{position:fixed;inset:0}
  #app canvas{display:block;outline:none;touch-action:none}
  #app canvas.hovering{cursor:pointer}
  .labels{position:absolute!important;inset:0;pointer-events:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #hud{top:16px;left:16px;width:292px;padding:14px 16px 14px}
  .brand{display:flex;gap:10px;align-items:center}
  .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#1a1304;font-weight:900;
    background:linear-gradient(135deg,#ffe08a,#c99a2e);box-shadow:0 0 18px rgba(245,196,81,.35)}
  h1{margin:0;font-size:16px;letter-spacing:.02em}
  h1 em{font-style:normal;color:var(--gold)}
  .brand p{margin:1px 0 0;color:var(--mut);font-size:11.5px;letter-spacing:.04em}
  .count{display:flex;align-items:baseline;gap:6px;margin:12px 0 10px;padding:8px 10px;border-radius:10px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
  .count b{font-size:28px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
  .count span{color:var(--mut)}
  .count label{margin-left:auto;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
  .btns{display:flex;gap:8px;margin-top:8px}
  button{flex:1;cursor:pointer;border-radius:9px;padding:8px 10px;font:600 12.5px/1 inherit;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);transition:.15s}
  button:hover{background:rgba(255,255,255,.1);border-color:rgba(245,196,81,.45)}
  button.primary{background:linear-gradient(180deg,#f7cf6a,#d9a63a);color:#1b1404;border-color:#f5c451}
  button.primary:hover{filter:brightness(1.08)}
  button.primary.on{box-shadow:0 0 0 2px rgba(245,196,81,.25),0 0 22px rgba(245,196,81,.45)}
  .btns.small button{font-size:11.5px;padding:7px 6px;font-weight:500}
  button.toggled{border-color:rgba(245,196,81,.6);color:var(--gold2)}
  #roster{top:16px;right:16px;width:270px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
  .ph{padding:10px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);
    border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;cursor:default}
  .ph span{color:var(--mut);letter-spacing:.04em;text-transform:none}
  #list{list-style:none;margin:0;padding:6px;overflow:auto}
  #list li{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:9px;cursor:pointer;transition:.12s}
  #list li:hover,#list li.hot{background:rgba(255,255,255,.06)}
  .sw{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .li-main{min-width:0;flex:1}
  .li-main b{font-weight:650}
  .li-main i{font-style:normal;color:var(--mut);font-size:11.5px}
  .li-main small{display:block;color:#6f778c;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #list li.busy .li-main small{color:#cfd6e6}
  .st{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:20px;
    color:#7d859a;border:1px solid rgba(255,255,255,.1);flex:none}
  #list li.busy .st{color:#121212;background:var(--c);border-color:transparent}
  #feed{left:16px;bottom:44px;width:340px;max-height:210px;overflow:hidden}
  #feedList{list-style:none;margin:0;padding:6px 12px 10px;font-size:12px}
  #feedList li{padding:3px 0;color:#c6cddd;display:flex;gap:8px;animation:fin .4s ease}
  #feedList li time{color:#69718a;font-variant-numeric:tabular-nums;flex:none}
  #feedList li .d{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:none}
  @keyframes fin{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:#7c849a;font-size:11.5px;
    letter-spacing:.03em;pointer-events:none;text-shadow:0 1px 6px #000;white-space:nowrap}
  .tagwrap{pointer-events:none}
  .tag{display:flex;flex-direction:column;align-items:center;padding:3px 8px 4px;border-radius:9px;white-space:nowrap;
    background:rgba(5,8,16,.78);border:1px solid rgba(255,255,255,.09);font-size:11px;line-height:1.2;
    transition:border-color .25s, box-shadow .25s, transform .2s;transform-origin:50% 100%}
  .tag .n{font-weight:700;display:flex;align-items:center;gap:5px;color:#f1f3f9}
  .tag .dot{width:7px;height:7px;border-radius:50%;background:#4e566b;transition:.25s}
  .tag .r{font-size:9px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
  .tag .a{display:none;font-size:10.5px;color:#f4e6bf;margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  .tag.busy{border-color:var(--c);box-shadow:0 0 14px -4px var(--c)}
  .tag.busy .dot{background:var(--c);box-shadow:0 0 8px var(--c)}
  .tag.hot{transform:scale(1.12);border-color:var(--gold)}
  .tag.hot .a{display:block}
  .tag.mgr .n{color:var(--gold2)}
  body.lbl-name .tag .r{display:none}
  body.lbl-off .tag{display:none}
  body.lbl-off .tag.hot{display:flex}
  #tip{position:fixed;pointer-events:none;z-index:20;min-width:190px;max-width:260px;padding:10px 12px;border-radius:12px;
    background:rgba(8,11,20,.92);border:1px solid rgba(245,196,81,.35);box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;transform:translateY(4px);transition:opacity .15s, transform .15s}
  #tip.show{opacity:1;transform:none}
  #tip .t1{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
  #tip .t2{color:var(--mut);font-size:11.5px;margin-top:1px}
  #tip .t3{margin-top:7px;font-size:12px;color:#dfe4ef}
  #tip .pill{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-left:auto;
    border:1px solid rgba(255,255,255,.15);color:#8b93a8}
  #tip .pill.busy{background:var(--c);color:#111;border-color:transparent}
  #loading,#err{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none;
    color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;font-size:12px;background:#04060b;transition:opacity .6s}
  #loading.done{opacity:0}
  #err{display:none;pointer-events:auto;text-transform:none;letter-spacing:0;font-size:14px;color:#e9ecf5;padding:30px}
  #err div{max-width:560px;line-height:1.55;background:#0b1020;border:1px solid var(--line);border-radius:14px;padding:22px 24px}
  #err code{background:#111a30;padding:2px 6px;border-radius:6px;color:var(--gold2)}
  /* live status */
  .live{display:flex;align-items:center;gap:8px;margin-top:10px;padding:7px 10px;border-radius:9px;font-size:11.5px;line-height:1.3;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:var(--mut)}
  .live .pd{width:8px;height:8px;border-radius:50%;flex:none;background:#59607a}
  .live b{letter-spacing:.14em;font-size:11px;color:var(--ink)}
  .live.ok{border-color:rgba(61,220,132,.35)}
  .live.ok .pd{background:#3ddc84;box-shadow:0 0 8px #3ddc84;animation:lp 1.8s ease-in-out infinite}
  .live.ok b{color:#5ff0a0}
  .live.demo{border-color:rgba(255,181,71,.45)}
  .live.demo .pd{background:#ffb547;box-shadow:0 0 8px #ffb547}
  .live.demo b{color:#ffc56b}
  .live.off{border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.08);color:#ffb3ba}
  .live.off .pd{background:#ff4d5e}
  .live.off b{color:#ff8a95}
  @keyframes lp{50%{opacity:.35}}
  #offline{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:30;display:none;padding:9px 16px;border-radius:10px;
    background:rgba(60,10,18,.92);border:1px solid rgba(255,77,94,.6);color:#ffd5da;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);
    max-width:min(560px,calc(100vw - 640px));text-align:center}
  #offline code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px;color:#ffe08a}
  body.is-off #offline{display:block}
  .st svg,.tag .ic svg,#tip .pill svg,#feedList svg{width:11px;height:11px;vertical-align:-2px;margin-right:3px}
  .tag .ic{display:none;color:var(--c)}
  .tag.busy .ic{display:inline-flex}
  #list li.st-blocked .li-main small{color:#ff9aa4}
  #feedList li span b{font-weight:650}
  #feedList li .s{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  @media (max-width:900px){
    #roster{width:220px;max-height:46vh}
    #feed{display:none}
    #hud{width:250px}
  }
</style>

<body>
<div id="app"></div>

<header id="hud" class="panel">
  <div class="brand">
    <div class="logo">V</div>
    <div><h1>Virtual Office <em>3D</em></h1><p>VOLTAIRE · AI CONTENT STUDIO</p></div>
  </div>
  <div class="count"><b id="workN">0</b><span>/ 16</span><label>agents active</label></div>
  <div id="live" class="live"><span class="pd"></span><span id="liveTxt"><b>CONNECTING</b> · reading status/status.json…</span></div>
  <div class="btns">
    <button id="btnSim">Simulate busy</button>
    <button id="btnReset" title="Re-read status.json now">Refresh</button>

  <div class="btns small">
    <button id="btnView">Overview</button>

    <button id="btnLabels">Labels: full</button>

</header>

<aside id="roster" class="panel">
  <div class="ph">Roster <span id="rosterCount">0 working</span></div>
  <ul id="list"></ul>
</aside>

<div id="feed" class="panel">
  <div class="ph">Studio activity <span id="clock"></span></div>
  <ul id="feedList"></ul>
</div>

<div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan · Click an agent (or roster row) to focus</div>
<div id="tip"></div>
<div id="offline"></div>
<div id="loading">Loading 3D studio…</div>
<div id="err"><div id="errMsg"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

window.__office3dLoaded = true;
const params = new URLSearchParams(location.search);
const USE_BLOOM = !params.has('nobloom');

/* ===================== ROSTER ===================== */
const AGENTS = [
  { id:'grok',  name:'Grok Bot', role:'Studio Manager', color:'#f5c451', robot:true,
    acts:['Dispatching today’s briefs','Reviewing pipeline status','Approving the shot list','Syncing with Voltaire','Assigning specialists'] },
  { id:'reed',  name:'Reed',  role:'Research',   color:'#2ec4b6', skin:0, hair:'#3a2a1e', style:'short', acc:['glasses'],
    acts:['Scanning trend reports','Fact-checking sources','Compiling research pack','Pulling reference links'] },
  { id:'iris',  name:'Iris',  role:'Ideas',      color:'#e8559a', skin:2, hair:'#1b1726', style:'bun',
    acts:['Brainstorming hooks','Pitching 5 concepts','Riffing on loglines','Sketching a moodboard'] },
  { id:'ivy',   name:'Ivy',   role:'Script',     color:'#5cc96b', skin:1, hair:'#7a3b1e', style:'ponytail',
    acts:['Drafting scene 3','Polishing dialogue','Formatting the screenplay','Prepping script lock'] },
  { id:'nova',  name:'Nova',  role:'Story',      color:'#9b6bff', skin:3, hair:'#e9cf98', style:'long',
    acts:['Mapping story beats','Building character arcs','Tightening act two','Writing story direction'] },
  { id:'atlas', name:'Atlas', role:'Canon',      color:'#c98a4b', skin:4, hair:'#24170f', style:'bald', acc:['beard'],
    acts:['Updating the lore bible','Checking canon conflicts','Indexing world rules'] },
  { id:'vera',  name:'Vera',  role:'Continuity', color:'#ff7a6b', skin:5, hair:'#a8322a', style:'bob',
    acts:['Visual Gate: checking stills','Flagging wardrobe drift','Cross-checking period details','Verifying locked refs'] },
  { id:'lens',  name:'Lens',  role:'Shots',      color:'#36c5f0', skin:1, hair:'#1e1e22', style:'short', acc:['capBack'],
    acts:['Planning camera angles','Writing the shot list','Blocking scene 4'] },
  { id:'pix',   name:'Pix',   role:'Prompts',    color:'#c77dff', skin:0, hair:'#ff9ad5', style:'bob', acc:['catEars'],
    acts:['Crafting image prompts','Tuning style seeds','Batching prompt variants'] },
  { id:'frame', name:'Frame', role:'Storyboard', color:'#ff9f43', skin:2, hair:'#2a1b12', style:'short', acc:['beret'],
    acts:['Sketching storyboard panels','Sequencing frames','Annotating transitions'] },
  { id:'reel',  name:'Reel',  role:'Media',      color:'#ff4d5e', skin:3, hair:'#141018', style:'short', acc:['headband'],
    acts:['Rendering video clips','Generating b-roll','Upscaling footage'] },
  { id:'vox',   name:'Vox',   role:'Audio',      color:'#4d7cff', skin:4, hair:'#0f0c0a', style:'short', acc:['headphones'],
    acts:['Recording voiceover','Mixing the score','Cleaning dialogue audio','Laying in SFX'] },
  { id:'cut',   name:'Cut',   role:'Edit',       color:'#b8e04a', skin:1, hair:'#1a1a1a', style:'mohawk',
    acts:['Assembling the rough cut','Trimming for pace','Color grading'] },
  { id:'judge', name:'Judge', role:'QC',         color:'#e6e9f2', skin:5, hair:'#9aa0ab', style:'short', acc:['squareGlasses','bowtie'],
    acts:['Running the QC checklist','Reviewing the final cut','Scoring pass / fail'] },
  { id:'press', name:'Press', role:'Publish',    color:'#8fa3bf', skin:2, hair:'#3b2a20', style:'short', acc:['fedora'],
    acts:['Exporting masters','Writing captions','Scheduling posts','Publishing to channels'] },
  { id:'pulse', name:'Pulse', role:'Analytics',  color:'#ffe14d', skin:0, hair:'#5a3a22', style:'short', acc:['cap'],
    acts:['Crunching view metrics','Spotting retention dips','Writing the lessons report'] },
];
const byId = Object.fromEntries(AGENTS.map(a => [a.id, a]));
// Hand-offs follow WORKFLOW.md (incl. Vera's Visual Gate before Reel)
const NEXT = {
  reed:['iris'], iris:['nova'], nova:['ivy'], ivy:['atlas','vera'], atlas:['vera'], vera:['lens','reel'],
  lens:['pix'], pix:['frame'], frame:['vera'], reel:['vox'], vox:['cut'], cut:['judge'], judge:['press'],
  press:['pulse'], pulse:['grok'], grok:[]
};
const PODS = [
  { key:'writers',    name:"WRITERS' ROOM",       x:-7.0, z:-4.2, ids:['reed','iris','nova','ivy'] },
  { key:'continuity', name:'CANON & CONTINUITY',  x: 0.0, z:-4.2, ids:['atlas','vera'] },
  { key:'visual',     name:'VISUAL LAB',          x: 7.0, z:-4.2, ids:['lens','pix','frame'] },
  { key:'production', name:'PRODUCTION BAY',      x:-7.0, z: 2.5, ids:['reel','vox','cut'] },
  { key:'release',    name:'RELEASE & INSIGHTS',  x: 7.0, z: 2.5, ids:['judge','press','pulse'] },
];
AGENTS.forEach(a => { a.pod = a.id === 'grok' ? 'STUDIO COMMAND' : PODS.find(p => p.ids.includes(a.id)).name; });

/* ===================== RENDERER / SCENE / CAMERA ===================== */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.className = 'labels';
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060b);
scene.fog = new THREE.Fog(0x04060b, 38, 85);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const HOME = { pos:new THREE.Vector3(0.6, 14.2, 18.6), target:new THREE.Vector3(0.6, 0.2, -0.2) };
camera.position.copy(HOME.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 3;
controls.maxDistance = 40;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.475;
controls.autoRotateSpeed = 0.55;
controls.screenSpacePanning = false;
controls.update();

let composer = null;
if (USE_BLOOM) {
  const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type:THREE.HalfFloatType, samples:4 });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.55, 0.92));
  composer.addPass(new OutputPass());
}

/* ===================== HELPERS ===================== */
const rng = (() => { let s = 20261006; return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const _mats = new Map();
function M(color, o = {}) {
  const key = color + '|' + JSON.stringify(o);
  if (!_mats.has(key)) {
    _mats.set(key, new THREE.MeshStandardMaterial({
      color, roughness:o.r ?? 0.7, metalness:o.m ?? 0, emissive:o.e ?? 0x000000, emissiveIntensity:o.ei ?? 1,
      transparent:o.t ?? false, opacity:o.o ?? 1, side:o.side ?? THREE.FrontSide, flatShading:o.flat ?? false,
    }));
  }
  return _mats.get(key);
}
const _geos = new Map();
const G = (key, fn) => { if (!_geos.has(key)) _geos.set(key, fn()); return _geos.get(key); };
const box = (w, h, d) => G(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));
const rbox = (w, h, d, r = 0.03) => G(`rb${w},${h},${d},${r}`, () =>
  new RoundedBoxGeometry(w, h, d, 3, Math.min(r, Math.min(w, h, d) / 2 - 0.0005)));
const cyl = (rt, rb, h, seg = 20) => G(`c${rt},${rb},${h},${seg}`, () => new THREE.CylinderGeometry(rt, rb, h, seg));
const sph = (r, ws = 20, hs = 14) => G(`s${r},${ws},${hs}`, () => new THREE.SphereGeometry(r, ws, hs));

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = null, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.userData = { canvas:c, g };
  return t;
}
const hdr = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

const glowTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const codeTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#0a0f1e'; g.fillRect(0, 0, w, h);

function posterTex(p) {
  return canvasTex(320, 480, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, p.a); gr.addColorStop(1, '#040408');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const rg = g.createRadialGradient(w / 2, h * 0.4, 5, w / 2, h * 0.4, w * 0.5);
    rg.addColorStop(0, p.b); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,.85)';
    g.beginPath(); g.arc(w / 2, h * 0.43, 26, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(w / 2 - 70, h * 0.68); g.quadraticCurveTo(w / 2, h * 0.43, w / 2 + 70, h * 0.68); g.fill();
    g.fillRect(0, h * 0.68, w, 4);

    g.fillText('A VOLTAIRE STUDIO PICTURE', w / 2, 30);

}

const chairBaseGeo = (() => {
  const parts = [];
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2;
    const leg = new THREE.BoxGeometry(0.05, 0.035, 0.3); leg.translate(0, 0.075, 0.15); leg.rotateY(a); parts.push(leg);
    const cas = new THREE.SphereGeometry(0.03, 8, 6); cas.translate(Math.sin(a) * 0.29, 0.03, Math.cos(a) * 0.29); parts.push(cas);
  }
  const hub = new THREE.CylinderGeometry(0.05, 0.06, 0.06, 12); hub.translate(0, 0.08, 0); parts.push(hub);
  return mergeGeometries(parts.map(p => p.toNonIndexed()));
})();

    const shell = M('#2a2f3c', { r:0.32, m:0.75 });
    mesh(rbox(0.46, 0.4, 0.4, 0.1), shell, 0, 0, 0, head);
    const visorMat = new THREE.MeshStandardMaterial({ color:0x1a1200, emissive:0xffc44d, emissiveIntensity:2.2 });
    parts.visor = mesh(rbox(0.36, 0.11, 0.03, 0.012), visorMat, 0, 0.03, 0.2, head, false);
    parts.visorMat = visorMat;
    for (const s of [-1, 1]) { const e = mesh(cyl(0.07, 0.07, 0.05, 18), goldMetal, s * 0.24, 0, 0, head); e.rotation.z = Math.PI / 2; }
    mesh(cyl(0.012, 0.012, 0.2, 8), goldMetal, 0.1, 0.29, 0, head);
    parts.antennaTip = mesh(sph(0.04, 12, 10), new THREE.MeshStandardMaterial({ color:0x1a1200, emissive:0xffd36b, emissiveIntensity:3 }), 0.1, 0.4, 0, head, false);
    mesh(box(0.12, 0.012, 0.01), M('#0a0c12'), 0, -0.1, 0.205, head, false);
    return parts;
  }
  const skin = M(SKINS[a.skin ?? 0], { r:0.62 });
  const hairM = M(a.hair || '#222', { r:0.78, side:THREE.DoubleSide });
  mesh(sph(r, 28, 20), skin, 0, 0, 0, head);
  for (const s of [-1, 1]) mesh(sph(0.045, 10, 8), skin, s * 0.205, -0.01, 0, head);
  const eyes = new THREE.Group(); head.add(eyes);
  for (const s of [-1, 1]) mesh(sph(0.03, 12, 10), M('#0b0b12', { r:0.3 }), s * 0.075, 0.005, 0.18, eyes, false);
  for (const s of [-1, 1]) mesh(sph(0.009, 6, 6), new THREE.MeshBasicMaterial({ color:0xffffff }), s * 0.068, 0.016, 0.207, eyes, false);
  parts.eyes = eyes;
  mesh(box(0.05, 0.012, 0.01), M('#5a2a24'), 0, -0.085, 0.192, head, false);
  for (const s of [-1, 1]) {
    const bl = new THREE.Mesh(G('blush', () => new THREE.CircleGeometry(0.03, 14)), new THREE.MeshBasicMaterial({ color:0xff7a8a, transparent:true, opacity:0.28, depthWrite:false }));
    bl.position.set(s * 0.12, -0.05, 0.168); bl.rotation.y = s * 0.6; head.add(bl);
  }
  const cap = () => { const c = mesh(G('hcap', () => new THREE.SphereGeometry(0.222, 28, 14, 0, Math.PI * 2, 0, Math.PI * 0.52)), hairM, 0, 0, 0, head); c.rotation.x = -0.38; return c; };
  const curtain = (h, y, open) => {
    const geo = G(`curt${h},${open}`, () => new THREE.CylinderGeometry(0.226, 0.235, h, 28, 1, true, open * Math.PI, (2 - 2 * open) * Math.PI));
    mesh(geo, hairM, 0, y, 0, head);
  };
  switch (a.style) {
    case 'short': cap(); break;
    case 'bun': cap(); mesh(sph(0.09, 14, 12), hairM, 0, 0.19, -0.1, head); break;
    case 'ponytail': {
      cap(); mesh(sph(0.03, 8, 8), M(a.color), 0, 0.06, -0.225, head);
      const p = mesh(G('ptail', () => new THREE.CapsuleGeometry(0.055, 0.2, 4, 10)), hairM, 0, -0.06, -0.27, head); p.rotation.x = 0.45;
      break;
    }
    case 'long': cap(); curtain(0.42, -0.13, 0.22); break;
    case 'bob': cap(); curtain(0.2, -0.04, 0.28); break;
    case 'bald': break;
    case 'mohawk':
      for (let i = 0; i < 6; i++) {
        const ang = -0.75 + i * 0.4;
        const m = mesh(box(0.05, 0.13, 0.08), hairM, 0, 0.215 * Math.cos(ang), -0.215 * Math.sin(ang), head);
        m.rotation.x = -ang;
      }
      break;
  }
  for (const acc of (a.acc || [])) {
    switch (acc) {
      case 'glasses': {
        const fm = M('#1a1a1a', { r:0.4, m:0.5 });
        for (const s of [-1, 1]) mesh(G('gl', () => new THREE.TorusGeometry(0.048, 0.009, 6, 18)), fm, s * 0.075, 0.005, 0.205, head, false);
        mesh(box(0.05, 0.01, 0.01), fm, 0, 0.012, 0.21, head, false);
        break;
      }
      case 'squareGlasses': {
        for (const s of [-1, 1]) { const g = mesh(G('sgl', () => new THREE.TorusGeometry(0.055, 0.009, 4, 4)), goldMetal, s * 0.075, 0.005, 0.205, head, false); g.rotation.z = Math.PI / 4; }
        mesh(box(0.04, 0.01, 0.01), goldMetal, 0, 0.012, 0.21, head, false);
        break;
      }
      case 'beard': {
        const b = mesh(sph(0.16, 16, 12), M(a.hair, { r:0.85 }), 0, -0.11, 0.07, head); b.scale.set(1.18, 0.78, 0.85);
        mesh(box(0.11, 0.025, 0.03), M(a.hair, { r:0.85 }), 0, -0.055, 0.195, head, false);
        break;
      }
      case 'headphones': {
        mesh(G('hpb', () => new THREE.TorusGeometry(0.24, 0.022, 8, 28, Math.PI)), blackPlastic, 0, 0, 0, head);
        for (const s of [-1, 1]) { const c = mesh(cyl(0.075, 0.075, 0.07, 20), M(a.color, { r:0.4, m:0.3 }), s * 0.23, 0, 0, head); c.rotation.z = Math.PI / 2; }
        break;
      }
      case 'capBack':
      case 'cap': {
        const fwd = acc === 'cap';
        const capM = M(fwd ? '#1d2433' : a.color, { r:0.7 });
        mesh(G('capd', () => new THREE.SphereGeometry(0.228, 28, 12, 0, Math.PI * 2, 0, Math.PI * 0.45)), capM, 0, 0.012, 0, head);
        const brim = mesh(G('brim', () => new THREE.CylinderGeometry(0.16, 0.16, 0.014, 24, 1, false, 0, Math.PI)), fwd ? M(a.color, { r:0.7 }) : capM,
          0, 0.07, fwd ? 0.15 : -0.15, head);
        brim.rotation.y = fwd ? -Math.PI / 2 : Math.PI / 2;
        brim.rotation.x = fwd ? 0.15 : -0.15;
        break;
      }
      case 'beret': {
        const b = mesh(sph(0.2, 24, 12), M('#2b1b2e', { r:0.9 }), 0.03, 0.18, -0.01, head);
        b.scale.set(1.18, 0.36, 1.18); b.rotation.z = 0.25;
        mesh(cyl(0.012, 0.012, 0.04, 6), M('#2b1b2e'), 0.06, 0.25, 0, head);
        break;
      }
      case 'headband': { const h = mesh(G('hband', () => new THREE.TorusGeometry(0.222, 0.024, 8, 32)), M('#f2f2f2', { r:0.6 }), 0, 0.08, 0, head); h.rotation.x = Math.PI / 2 - 0.25; break; }
      case 'catEars': {
        mesh(G('cband', () => new THREE.TorusGeometry(0.225, 0.012, 6, 28, Math.PI)), M('#1b1b22'), 0, 0.02, 0.02, head);
        for (const s of [-1, 1]) {
          const e = mesh(G('cear', () => new THREE.ConeGeometry(0.065, 0.12, 4)), M(a.color, { r:0.6, flat:true }), s * 0.13, 0.21, 0.02, head);
          e.rotation.z = -s * 0.4;
        }
        break;
      }
      case 'fedora': {
        const fm = M('#2f3542', { r:0.75 });
        mesh(cyl(0.34, 0.34, 0.02, 32), fm, 0, 0.13, 0, head);
        mesh(cyl(0.19, 0.215, 0.18, 32), fm, 0, 0.23, 0, head);
        mesh(cyl(0.217, 0.217, 0.04, 32), goldMetal, 0, 0.165, 0, head);
        break;
      }
    }
  }
  return parts;
}

function buildFigure(a) {
  const fig = new THREE.Group();
  const shirt = a.robot ? M('#c9a24a', { r:0.35, m:0.7 }) : M(a.color, { r:0.65 });
  const pants = M(a.robot ? '#1b2030' : '#1d2433', { r:0.8 });
  const skin = a.robot ? M('#2a2f3c', { r:0.32, m:0.75 }) : M(SKINS[a.skin ?? 0], { r:0.62 });
  const shoe = M('#0b0d13', { r:0.5 });

  mesh(rbox(0.4, 0.15, 0.34, 0.05), pants, 0, 0.56, 0, fig);
  for (const s of [-1, 1]) {
    mesh(rbox(0.16, 0.15, 0.42, 0.05), pants, s * 0.1, 0.56, 0.2, fig);
    mesh(rbox(0.14, 0.46, 0.15, 0.05), pants, s * 0.1, 0.3, 0.4, fig);
    mesh(rbox(0.16, 0.08, 0.25, 0.035), shoe, s * 0.1, 0.04, 0.45, fig);
  }
  const body = new THREE.Group(); body.position.y = 0.6; fig.add(body);
  mesh(rbox(0.46, 0.48, 0.3, 0.1), shirt, 0, 0.25, 0, body);
  if (a.robot) {
    mesh(rbox(0.3, 0.26, 0.02, 0.008), M('#1b2030', { r:0.4, m:0.5 }), 0, 0.27, 0.15, body, false);
    mesh(sph(0.035, 12, 10), new THREE.MeshStandardMaterial({ color:0x111111, emissive:0xffd36b, emissiveIntensity:3 }), 0, 0.3, 0.165, body, false);
  } else {
    mesh(rbox(0.2, 0.05, 0.05, 0.02), M('#' + new THREE.Color(a.color).multiplyScalar(0.7).getHexString(), { r:0.7 }), 0, 0.47, 0.08, body, false);
  }
  mesh(cyl(0.065, 0.075, 0.1, 12), skin, 0, 0.52, 0, body);
  if ((a.acc || []).includes('bowtie')) {
    for (const s of [-1, 1]) { const c = mesh(G('bow', () => new THREE.ConeGeometry(0.035, 0.07, 4)), M('#b8343f', { r:0.6 }), s * 0.035, 0.44, 0.16, body, false); c.rotation.z = s * Math.PI / 2; }
    mesh(sph(0.018, 8, 6), M('#b8343f'), 0, 0.44, 0.165, body, false);
  }
  const head = new THREE.Group(); head.position.y = 0.76; body.add(head);
  const hp = buildHead(a, head);

  const arms = [];
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(s * 0.285, 0.4, 0); body.add(sh);
    mesh(G('upper', () => new THREE.CapsuleGeometry(0.066, 0.16, 4, 10)), shirt, 0, -0.13, 0, sh);
    const el = new THREE.Group(); el.position.y = -0.26; sh.add(el);
    mesh(G('fore', () => new THREE.CapsuleGeometry(0.056, 0.18, 4, 10)), skin, 0, -0.14, 0, el);
    mesh(sph(0.062, 12, 10), skin, 0, -0.29, 0, el);
    arms.push({ sh, el, s });
  }
  // 'learning' prop: an open book held in both hands
  const book = new THREE.Group(); book.position.set(0, 0.3, 0.43); book.rotation.x = -0.75; book.visible = false; body.add(book);
  const cover = M('#' + new THREE.Color(a.color).multiplyScalar(0.55).getHexString(), { r:0.6 });
  const paper = M('#f1e9d6', { r:0.9, e:0x2a261c });
  for (const s of [-1, 1]) {
    const half = new THREE.Group(); half.rotation.z = s * 0.2; book.add(half);
    mesh(box(0.15, 0.012, 0.21), cover, s * 0.077, 0, 0, half, false);
    mesh(box(0.14, 0.014, 0.195), paper, s * 0.072, 0.012, 0, half, false);
    for (let k = 0; k < 4; k++) mesh(box(0.1, 0.0015, 0.008), M('#8a8274'), s * 0.075, 0.02, -0.06 + k * 0.035, half, false);
  }
  // 'leads' prop: a magnifying glass in the right hand
  const mag = new THREE.Group(); mag.position.set(0, -0.3, 0); mag.visible = false; arms[1].el.add(mag);
  mesh(cyl(0.016, 0.02, 0.13, 10), M('#2a1d12', { r:0.5 }), 0, -0.05, 0, mag, false);
  const ringG = new THREE.Group(); ringG.position.y = -0.19; ringG.rotation.y = 0.5; mag.add(ringG);
  mesh(G('magRing', () => new THREE.TorusGeometry(0.075, 0.012, 8, 28)), goldMetal, 0, 0, 0, ringG, false);
  const lens = new THREE.Mesh(G('magLens', () => new THREE.CircleGeometry(0.072, 28)),
    new THREE.MeshStandardMaterial({ color:0xbfe6ff, emissive:0x3a7fbf, emissiveIntensity:0.6, transparent:true, opacity:0.45, roughness:0.05, metalness:0.1, side:THREE.DoubleSide }));
  ringG.add(lens);
  return { fig, body, head, arms, book, mag, ...hp };
}

/* ===================== WORKSTATIONS ===================== */
const pickables = [];
const PROPSETS = {
  reed:['books','mug'], iris:['plant','papers'], nova:['papers','mug'], ivy:['papers','lamp'], atlas:['books','lamp'],
  vera:['tablet','mug'], lens:['clapper','mug'], pix:['tablet','plant'], frame:['papers','clapper'], reel:['clapper','mug'],
  vox:['headphones','mug'], cut:['tablet','plant'], judge:['papers','lamp'], press:['tablet','mug'], pulse:['tablet','plant'],
};

function buildWorkstation(a, big = false) {
  const W = big ? 2.1 : 1.45, D = big ? 0.95 : 0.75, H = 0.74, seatZ = big ? 0.74 : 0.62;
  const ws = new THREE.Group();
  const topMat = big ? M('#221a10', { r:0.32, m:0.25 }) : M('#1c2335', { r:0.45, m:0.12 });
  const sideMat = big ? M('#14100a', { r:0.4, m:0.3 }) : darkMetal;
  mesh(rbox(W, 0.05, D, 0.018), topMat, 0, H - 0.025, 0, ws);
  if (big) {
    mesh(box(W + 0.01, 0.012, D + 0.01), goldMetal, 0, H - 0.05, 0, ws);
    mesh(box(W, 0.6, 0.04), sideMat, 0, H - 0.36, -D / 2 + 0.03, ws);
    const plate = canvasTex(512, 96, (g, w, h) => {
      g.fillStyle = '#0d0a05'; g.fillRect(0, 0, w, h); g.strokeStyle = '#c9a24a'; g.lineWidth = 4; g.strokeRect(6, 6, w - 12, h - 12);
      g.fillStyle = '#ffd77a'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = 'bold 36px Georgia,serif'; g.fillText('GROK BOT · STUDIO MANAGER', w / 2, h / 2 + 2);
    });
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.28), new THREE.MeshBasicMaterial({ map:plate, color:hdr(0xffffff, 1.15) }));
    pl.position.set(0, H - 0.25, -D / 2 + 0.005); pl.rotation.y = Math.PI; ws.add(pl);
  } else {
    mesh(box(W - 0.14, 0.36, 0.02), darkMetal, 0, H - 0.28, -D / 2 + 0.05, ws);
  }
  for (const sx of [-1, 1]) {
    mesh(box(0.05, H - 0.05, D - 0.1), sideMat, sx * (W / 2 - 0.06), (H - 0.05) / 2, 0, ws);
    mesh(box(0.07, 0.02, D - 0.04), darkMetal, sx * (W / 2 - 0.06), 0.01, 0, ws);
  }
  // monitors
  const screens = [];
  const tint = new THREE.Color(a.color).lerp(new THREE.Color(0xffffff), 0.55);
  const monXs = big ? [-0.4, 0.4] : [0];
  for (const mx of monXs) {
    const mon = new THREE.Group(); mon.position.set(mx, H, -0.17); mon.rotation.y = -mx * 0.6; ws.add(mon);
    mesh(box(0.22, 0.015, 0.16), darkMetal, 0, 0.008, 0, mon);
    mesh(box(0.04, 0.26, 0.03), darkMetal, 0, 0.14, -0.03, mon);
    mesh(rbox(0.68, 0.42, 0.035, 0.012), blackPlastic, 0, 0.42, 0, mon);
    const map = codeTex.clone(); map.needsUpdate = true; map.offset.y = Math.random();
    const scrMat = new THREE.MeshBasicMaterial({ map, color:tint.clone().multiplyScalar(0.22) });
    const scr = new THREE.Mesh(G('scr', () => new THREE.PlaneGeometry(0.63, 0.37)), scrMat);
    scr.position.set(0, 0.42, 0.0185); mon.add(scr);
    screens.push(scrMat);
  }
  // keyboard / mouse
  mesh(rbox(0.46, 0.022, 0.15, 0.008), M('#1a1f2b', { r:0.5 }), 0, H + 0.011, 0.19, ws);
  const keysMat = new THREE.MeshBasicMaterial({ color:tint.clone().multiplyScalar(0.05) });
  const keys = new THREE.Mesh(G('keys', () => new THREE.PlaneGeometry(0.42, 0.11)), keysMat);
  keys.rotation.x = -Math.PI / 2; keys.position.set(0, H + 0.023, 0.19); ws.add(keys);
  mesh(rbox(0.065, 0.026, 0.1, 0.012), M('#1a1f2b', { r:0.5 }), 0.34, H + 0.013, 0.2, ws);
  // light spill from the screen onto the desk
  const spillMat = new THREE.MeshBasicMaterial({ map:glowTex, color:tint, transparent:true, opacity:0.05, blending:THREE.AdditiveBlending, depthWrite:false });
  const spill = new THREE.Mesh(G('spill', () => new THREE.PlaneGeometry(1.2, 0.8)), spillMat);
  spill.rotation.x = -Math.PI / 2; spill.position.set(0, H + 0.004, 0.08); ws.add(spill);
  // props
  if (big) {
    addProp('mug', ws, -0.85, 0.05, H, '#c9a24a'); addProp('clapper', ws, 0.82, -0.15, H, a.color);
    addProp('plant', ws, -0.88, -0.3, H, a.color); addProp('tablet', ws, 0.62, 0.22, H, a.color);
  } else {
    const ps = PROPSETS[a.id] || ['mug'];
    addProp(ps[0], ws, -0.52, -0.08, H, a.color);
    if (ps[1]) addProp(ps[1], ws, 0.55, -0.22, H, ['#e8e4d8','#c9a24a','#36c5f0','#e8559a'][Math.floor(rng() * 4)]);
  }
  // seat (chair + NPC) facing the desk (-Z local)
  const seat = new THREE.Group(); seat.position.set(0, 0, seatZ); seat.rotation.y = Math.PI; ws.add(seat);
  seat.add(buildChair(new THREE.Color(a.color), big));
  const F = buildFigure(a); seat.add(F.fig);
  seat.traverse(o => { if (o.isMesh) { o.userData.agent = a; pickables.push(o); } });
  // status ring + glow pool on the floor
  const ringMat = new THREE.MeshBasicMaterial({ color:hdr(a.color, 1.4), transparent:true, opacity:0.1, blending:THREE.AdditiveBlending, depthWrite:false });
  const ring = new THREE.Mesh(G('ring', () => new THREE.RingGeometry(0.56, 0.64, 56)), ringMat);
  ring.rotation.x = -Math.PI / 2; ring.position.set(0, 0.012, seatZ); ws.add(ring);
  const poolMat = new THREE.MeshBasicMaterial({ map:glowTex, color:new THREE.Color(a.color), transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  const pool = new THREE.Mesh(G('pool', () => new THREE.PlaneGeometry(1.5, 1.5)), poolMat);
  pool.rotation.x = -Math.PI / 2; pool.position.set(0, 0.008, seatZ); ws.add(pool);
  // floating name tag (HTML, always faces camera)
  const wrap = document.createElement('div'); wrap.className = 'tagwrap';
  wrap.innerHTML = `<div class="tag${a.robot ? ' mgr' : ''}" style="--c:${a.color}"><div class="n"><span class="dot"></span><span class="ic"></span>${a.name}</div><div class="r">${a.role}</div><div class="a"></div></div>`;
  const label = new CSS2DObject(wrap);
  label.position.set(0, big ? 1.95 : 1.82, seatZ);
  ws.add(label);

  Object.assign(a, {
    ws, seat, F, screens, keysMat, spillMat, ringMat, poolMat, tint,
    tagEl:wrap.firstElementChild, actEl:wrap.querySelector('.a'), tagIc:wrap.querySelector('.ic'), seatZ, big,
    busy:false, state:'idle', task:'', updated:null, b:0, wL:0, wD:0, wK:0, glow:new THREE.Color(a.color),
    hover:0, activity:'', timer:0, phase:Math.random() * 100,
    gesture:null, gT:rand(4, 14), blinkT:rand(1, 5), flash:0,
  });
  return ws;
}

/* ===================== LAYOUT: pods + command desk ===================== */
const COLW = 1.6;
function rug(x, z, w, d, label, accent, border = '#c9a24a') {
  const ch = Math.round(1024 * d / w);
  const tex = canvasTex(1024, ch, (g, W, H) => {
    g.fillStyle = '#0d1324'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(120,140,200,${rng() * 0.05})`; g.fillRect(rng() * W, rng() * H, 2, 2); }
    g.strokeStyle = border; g.globalAlpha = 0.55; g.lineWidth = 7; g.strokeRect(16, 16, W - 32, H - 32);
    g.globalAlpha = 0.22; g.lineWidth = 2; g.strokeRect(34, 34, W - 68, H - 68);
    if (label) {
      g.globalAlpha = 0.8; g.fillStyle = accent; g.textAlign = 'center';
      g.font = '600 40px Helvetica,Arial,sans-serif'; g.fillText(label.split('').join(' '), W / 2, H - 58);
    }
    g.globalAlpha = 1;
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ map:tex, roughness:0.95 }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.004, z); m.receiveShadow = true; scene.add(m);
}

for (const p of PODS) {
  const n = p.ids.length, cols = Math.ceil(n / 2);
  const rowA = p.ids.slice(0, cols), rowB = p.ids.slice(cols);
  const cx = i => p.x + (i - (cols - 1) / 2) * COLW;
  rowA.forEach((id, i) => { const ws = buildWorkstation(byId[id]); ws.position.set(cx(i), 0, p.z - 0.4); ws.rotation.y = Math.PI; scene.add(ws); });
  rowB.forEach((id, i) => { const ws = buildWorkstation(byId[id]); ws.position.set(cx(i), 0, p.z + 0.4); scene.add(ws); });
  if (rowB.length < cols) {   // filler: cabinet + printer + small plant
    const fx = cx(cols - 1), fz = p.z + 0.45;
    const g = new THREE.Group(); g.position.set(fx, 0, fz); scene.add(g);
    mesh(rbox(0.9, 0.7, 0.6, 0.02), M('#161c2c', { r:0.5, m:0.3 }), 0, 0.35, 0, g);
    for (let i = 0; i < 3; i++) mesh(box(0.8, 0.005, 0.01), goldMetal, 0, 0.18 + i * 0.2, 0.301, g, false);
    mesh(rbox(0.5, 0.22, 0.4, 0.03), M('#d8dbe4', { r:0.5 }), -0.1, 0.81, 0, g);
    mesh(box(0.3, 0.004, 0.2), M('#ffffff', { r:0.9 }), -0.1, 0.925, 0.05, g, false);
    addPlant(fx + 0.3, fz, 0.4).position.y = 0.7;
  }

function fmtTime(iso, full = false) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const hm = d.toTimeString().slice(0, 5);
  return full ? d.toLocaleDateString([], { month:'short', day:'numeric' }) + ' ' + d.toTimeString().slice(0, 8) : hm;
}
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000; if (isNaN(s)) return '';
  return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`;
}
function setState(a, state, task, updated) {
  if (!STATES[state]) state = 'idle';
  const prev = a.state;
  a.state = state; a.task = task || ''; a.updated = updated || null;
  a.busy = state === 'working' || state === 'learning' || state === 'leads';
  a.activity = a.task;
  if (state !== 'idle') a.gesture = null;
  if (prev !== state && state !== 'idle') a.flash = 1;

}

function snapPose(a) {

  a.glow.set(a.state === 'working' || a.state === 'idle' ? a.color : STATES[a.state].col);

}

function setLiveUI() {
  const el = $('live'), tx = $('liveTxt'), off = $('offline');
  el.className = 'live ' + (live.mode === 'demo' ? 'demo' : live.ok ? 'ok' : live.ok === false ? 'off' : '');

function renderFeed(entries) {

function applyLive() {

/* ===================== DEMO SIMULATION (optional, off by default) ===================== */

  const n = 8 + Math.floor(Math.random() * 4);

  $('feedList').innerHTML = ''; feed('Demo stopped — back to LIVE status', '#8b93a8');

function updateSim(dt) {

    a.timer -= dt;

    if (a.busy) {
      const done = a.activity;

      let targets = NEXT[a.id];
      if (a.id === 'grok') targets = AGENTS.filter(x => !x.busy && x.id !== 'grok').map(x => x.id);
      if (targets.length && Math.random() < 0.75) {
        const to = byId[pick(targets)];

        feed(`<b style="color:${a.color}">${a.name}</b> → <b style="color:${to.color}">${to.name}</b> · ${a.id === 'grok' ? 'new brief' : done.toLowerCase()}`, a.color);
      } else feed(`<b style="color:${a.color}">${a.name}</b> finished: ${done.toLowerCase()}`, a.color);

// hand-off orbs flying between desks
const orbs = [];
const orbGeo = new THREE.SphereGeometry(0.07, 14, 10);

  const trail = [];
  for (let i = 0; i < 10; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:new THREE.Color(from.color), transparent:true,
      opacity:0.65 * (1 - i / 10), blending:THREE.AdditiveBlending, depthWrite:false }));

  a.wD += ((a.state === 'leads'    ? 1 : 0) - a.wD) * k4;   // magnifier, scanning

const raycaster = new THREE.Raycaster();

}
